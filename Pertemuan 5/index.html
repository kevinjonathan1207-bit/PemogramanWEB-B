<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Student Management</span>
        </div>
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">About</a>
            <i class="fa-solid fa-circle-user user-icon"></i>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Form Panel (Kiri) -->
        <section class="card">
            <h2 class="card-title">Form Student</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label for="NRP">NRP</label>
                    <input type="text" id="NRP" placeholder="Masukkan NRP" required>
                </div>

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="jurusan">Jurusan</label>
                    <select id="jurusan" required>
                        <option value="" disabled selected>Pilih Jurusan</option>
                        <option value="Teknik Informatika">Teknik Informatika</option>
                        <option value="Teknik Elektro">Teknik Elektro</option>
                        <option value="Teknik Komputer">Teknik Komputer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btnSimpan">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnBatal" onclick="resetForm()">
                        <i class="fa-solid fa-ban"></i> Batal
                    </button>
                    <button type="button" class="btn btn-danger" id="btnReset" onclick="resetForm()">
                        <i class="fa-solid fa-rotate-right"></i> Reset
                    </button>
                </div>
            </form>
        </section>

        <!-- Table Panel (Kanan) -->
        <section class="card">
            <div class="table-header">
                <h2 class="card-title" style="margin-bottom:0;">Data Mahasiswa</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari mahasiswa..." onkeyup="searchData()">
                    <button type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>NRP</th>
                            <th>Nama</th>
                            <th>Jurusan</th>
                            <th>Email</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Data dimasukkan secara dinamis lewat JS -->
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <span id="dataCount">Menampilkan 1-5 dari 5 data</span>
                <div class="pagination">
                    <button>&laquo;</button>
                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>&rsaquo;</button>
                    <button>&raquo;</button>
                </div>
            </div>
        </section>
    </main>

    <!-- JS Terpisah -->
    <script src="app.js"></script>
</body>
</html>
