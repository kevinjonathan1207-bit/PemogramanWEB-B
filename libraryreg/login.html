<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Petugas - LibraryReg</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="layout-nav"></div>

  <main class="login-wrap">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="panel">
            <h1 class="h3 mb-1">Login Petugas</h1>
            <p class="text-muted-ink small">Masuk untuk mengelola data anggota.</p>
            <div id="pesanLogin" class="alert alert-danger py-2 d-none" role="alert"></div>
            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label req">Username</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username" placeholder="Masukkan username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label req">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" placeholder="Masukkan password">
              </div>
              <button type="submit" class="btn btn-teal w-100"><i class="bi bi-box-arrow-in-right me-2"></i>Masuk</button>
            </form>
            <p class="small text-muted-ink mt-3 mb-0">Akun demo: <strong>petugas</strong> / <strong>admin123</strong> (simulasi antarmuka).</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="layout-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
