<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Anggota - LibraryReg</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="anggota">
  <div id="layout-nav"></div>

  <main>
    <header class="page-head">
      <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <h1 class="h2 mb-1">Daftar Anggota</h1>
          <p class="mb-0 text-muted-ink">Kelola data anggota perpustakaan.</p>
        </div>
        <a href="pendaftaran.html" class="btn btn-teal"><i class="bi bi-plus-lg me-1"></i>Tambah Anggota</a>
      </div>
    </header>
    <section class="block">
      <div class="container">
        <div class="panel">
          <div class="row g-2 align-items-center mb-3">
            <div class="col-md-6">
              <label for="cari" class="visually-hidden">Cari anggota</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" class="form-control" id="cari" placeholder="Cari berdasarkan nama atau NIM/NIP">
              </div>
            </div>
            <div class="col-md-6 text-md-end text-muted-ink small" id="infoJumlah" aria-live="polite"></div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead><tr><th>No</th><th>Nama lengkap</th><th>NIM/NIP</th><th>Program studi</th><th>Jenis</th><th>Telepon</th><th>Aksi</th></tr></thead>
              <tbody id="tbodyAnggota"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal detail -->
  <div class="modal fade" id="modalDetail" tabindex="-1" aria-labelledby="judulDetail" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="judulDetail">Detail anggota</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
        <div class="modal-body"><dl class="row mb-0" id="isiDetail"></dl></div>
        <div class="modal-footer"><button type="button" class="btn btn-light border" data-bs-dismiss="modal">Tutup</button></div>
      </div>
    </div>
  </div>

  <!-- Modal edit -->
  <div class="modal fade" id="modalEdit" tabindex="-1" aria-labelledby="judulEdit" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="formEdit" novalidate>
          <div class="modal-header"><h2 class="modal-title h5" id="judulEdit">Edit data anggota</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
          <div class="modal-body"><div class="row g-3"></div><p class="small text-muted-ink mt-3 mb-0">NIM/NIP tidak dapat diubah.</p></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-teal">Simpan perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Dialog konfirmasi hapus -->
  <div class="modal fade" id="modalHapus" tabindex="-1" aria-labelledby="judulHapus" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="judulHapus">Hapus anggota</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
        <div class="modal-body">Hapus data <strong id="namaHapus"></strong>? Tindakan ini tidak dapat dibatalkan.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger" id="btnHapus">Hapus</button>
        </div>
      </div>
    </div>
  </div>

  <div id="layout-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/anggota.js"></script>
</body>
</html>
