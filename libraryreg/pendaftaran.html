<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran Anggota - LibraryReg</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="pendaftaran">
  <div id="layout-nav"></div>

  <main>
    <header class="page-head">
      <div class="container">
        <h1 class="h2 mb-1">Pendaftaran Anggota</h1>
        <p class="mb-0 text-muted-ink">Lengkapi data berikut untuk menjadi anggota perpustakaan. Kolom bertanda * wajib diisi.</p>
      </div>
    </header>
    <section class="block">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="panel">
              <form id="formDaftar" novalidate>
                <div class="row g-3"></div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button type="reset" class="btn btn-light border">Reset</button>
                  <button type="submit" class="btn btn-teal"><i class="bi bi-person-plus-fill me-2"></i>Daftar Sekarang</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="layout-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pendaftaran.js"></script>
</body>
</html>
